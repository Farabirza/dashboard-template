<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <script src="assets/js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17?plugins=forms"></script>
  <script src="assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="bg-white font-sans text-slate-700 antialiased dark:bg-slate-950 dark:text-slate-300">
  <div class="flex min-h-screen">
    <!-- Form side -->
    <div class="relative flex flex-1 flex-col justify-center px-4 py-12 sm:px-6 lg:flex-none lg:px-20 xl:px-24">
      <button type="button" data-theme-toggle class="absolute right-4 top-4 rounded-lg p-2 text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800" aria-label="Toggle dark mode">
        <i data-lucide="moon" class="h-5 w-5 dark:hidden"></i>
        <i data-lucide="sun" class="hidden h-5 w-5 dark:block"></i>
      </button>

      <div class="mx-auto w-full max-w-sm">
        <a href="index.html" class="inline-flex h-10 w-10 items-center justify-center rounded-xl bg-primary-600 text-white"><i data-lucide="layout-dashboard" class="h-5 w-5"></i></a>
        <h1 class="mt-8 text-2xl font-semibold tracking-tight text-slate-900 dark:text-white">Sign in to your account</h1>
        <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">
          Don't have an account? <a href="register.html" class="font-medium text-primary-600 hover:text-primary-700 dark:text-primary-400">Create one</a>
        </p>

        <form id="login-form" class="mt-8 space-y-5" novalidate>
          <div>
            <label for="email" class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" class="w-full rounded-lg border-slate-200 bg-white text-sm placeholder:text-slate-400 focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200">
          </div>
          <div>
            <div class="mb-1.5 flex items-center justify-between">
              <label for="password" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Password</label>
              <a href="#" data-toast="Password reset link sent (demo)" class="text-sm font-medium text-primary-600 hover:text-primary-700 dark:text-primary-400">Forgot?</a>
            </div>
            <div class="relative">
              <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6" class="w-full rounded-lg border-slate-200 bg-white pr-10 text-sm focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200">
              <button type="button" data-password-toggle="password" class="absolute inset-y-0 right-0 flex items-center px-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" aria-label="Show password">
                <i data-show data-lucide="eye" class="h-4 w-4"></i>
                <i data-hide data-lucide="eye-off" class="hidden h-4 w-4"></i>
              </button>
            </div>
          </div>
          <label class="flex items-center gap-2 text-sm">
            <input type="checkbox" name="remember" class="h-4 w-4 rounded border-slate-300 text-primary-600 focus:ring-primary-500 dark:border-slate-600 dark:bg-slate-900">
            Remember me
          </label>
          <button type="submit" class="flex w-full items-center justify-center gap-2 rounded-lg bg-primary-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500/40 disabled:opacity-60">
            <svg data-spinner class="hidden h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-opacity=".25" stroke-width="4"/><path d="M22 12a10 10 0 0 0-10-10" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
            Sign in
          </button>
        </form>
      </div>
    </div>

    <!-- Brand side -->
    <div class="relative hidden flex-1 overflow-hidden bg-primary-600 lg:block">
      <div class="absolute inset-0 bg-gradient-to-br from-primary-500 via-primary-700 to-violet-800"></div>
      <div class="absolute -right-24 -top-24 h-96 w-96 rounded-full bg-white/10 blur-3xl"></div>
      <div class="absolute -bottom-32 -left-16 h-96 w-96 rounded-full bg-violet-400/20 blur-3xl"></div>
      <div class="relative flex h-full flex-col justify-end p-16 text-white">
        <p class="max-w-md text-2xl font-semibold leading-snug">Everything you need to run your business, in one clean dashboard.</p>
        <p class="mt-4 max-w-md text-sm text-white/70">Replace this panel with your product screenshot, testimonial or illustration.</p>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/validate.js"></script>
  <script>
    App.ready(function ($) {
      $('#login-form').formValidate({
        onValid: function ($form, data) {
          var $btn = $form.find('[type=submit]').prop('disabled', true);
          $btn.find('[data-spinner]').removeClass('hidden');
          // Replace with your auth request, e.g. $.post('/login', data)
          setTimeout(function () {
            App.toast('Signed in (demo). Redirecting…', 'success');
            setTimeout(function () { window.location.href = 'index.html'; }, 800);
          }, 700);
        },
      });
    });
  </script>
</body>
</html>
