<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account</title>
  <script src="assets/js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17?plugins=forms"></script>
  <script src="assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="bg-slate-50 font-sans text-slate-700 antialiased dark:bg-slate-950 dark:text-slate-300">
  <button type="button" data-theme-toggle class="fixed right-4 top-4 rounded-lg p-2 text-slate-500 hover:bg-slate-200/60 dark:text-slate-400 dark:hover:bg-slate-800" aria-label="Toggle dark mode">
    <i data-lucide="moon" class="h-5 w-5 dark:hidden"></i>
    <i data-lucide="sun" class="hidden h-5 w-5 dark:block"></i>
  </button>

  <div class="flex min-h-screen items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <div class="text-center">
        <a href="index.html" class="inline-flex h-10 w-10 items-center justify-center rounded-xl bg-primary-600 text-white"><i data-lucide="layout-dashboard" class="h-5 w-5"></i></a>
        <h1 class="mt-6 text-2xl font-semibold tracking-tight text-slate-900 dark:text-white">Create your account</h1>
        <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">Start your 14-day free trial. No credit card required.</p>
      </div>

      <form id="register-form" class="mt-8 space-y-5 rounded-2xl border border-slate-200 bg-white p-6 shadow-card sm:p-8 dark:border-slate-800 dark:bg-slate-900" novalidate>
        <div class="grid gap-5 sm:grid-cols-2">
          <div>
            <label for="r-first" class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300">First name</label>
            <input id="r-first" name="first" autocomplete="given-name" required class="w-full rounded-lg border-slate-200 bg-white text-sm focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200">
          </div>
          <div>
            <label for="r-last" class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300">Last name</label>
            <input id="r-last" name="last" autocomplete="family-name" required class="w-full rounded-lg border-slate-200 bg-white text-sm focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200">
          </div>
        </div>
        <div>
          <label for="r-email" class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300">Work email</label>
          <input id="r-email" name="email" type="email" autocomplete="email" required class="w-full rounded-lg border-slate-200 bg-white text-sm focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200">
        </div>
        <div>
          <label for="r-password" class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300">Password</label>
          <div class="relative">
            <input id="r-password" name="password" type="password" autocomplete="new-password" required minlength="8" class="w-full rounded-lg border-slate-200 bg-white pr-10 text-sm focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200">
            <button type="button" data-password-toggle="r-password" class="absolute inset-y-0 right-0 flex items-center px-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" aria-label="Show password">
              <i data-show data-lucide="eye" class="h-4 w-4"></i>
              <i data-hide data-lucide="eye-off" class="hidden h-4 w-4"></i>
            </button>
          </div>
          <!-- Strength meter -->
          <div class="mt-2 flex gap-1" aria-hidden="true">
            <span data-strength-bar class="h-1 flex-1 rounded-full bg-slate-200 dark:bg-slate-700"></span>
            <span data-strength-bar class="h-1 flex-1 rounded-full bg-slate-200 dark:bg-slate-700"></span>
            <span data-strength-bar class="h-1 flex-1 rounded-full bg-slate-200 dark:bg-slate-700"></span>
            <span data-strength-bar class="h-1 flex-1 rounded-full bg-slate-200 dark:bg-slate-700"></span>
          </div>
          <p data-strength-label class="mt-1 text-xs text-slate-500 dark:text-slate-400">At least 8 characters.</p>
        </div>
        <div>
          <label for="r-confirm" class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300">Confirm password</label>
          <input id="r-confirm" name="confirm" type="password" autocomplete="new-password" required data-match="#r-password" data-error="Passwords do not match." class="w-full rounded-lg border-slate-200 bg-white text-sm focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200">
        </div>
        <label class="flex items-start gap-2 text-sm">
          <input type="checkbox" name="terms" required class="mt-0.5 h-4 w-4 rounded border-slate-300 text-primary-600 focus:ring-primary-500 dark:border-slate-600 dark:bg-slate-800">
          <span>I agree to the <a href="#" class="font-medium text-primary-600 dark:text-primary-400">Terms</a> and <a href="#" class="font-medium text-primary-600 dark:text-primary-400">Privacy Policy</a></span>
        </label>
        <button type="submit" class="flex w-full items-center justify-center gap-2 rounded-lg bg-primary-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500/40 disabled:opacity-60">
          <svg data-spinner class="hidden h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-opacity=".25" stroke-width="4"/><path d="M22 12a10 10 0 0 0-10-10" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
          Create account
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-slate-500 dark:text-slate-400">
        Already have an account? <a href="login.html" class="font-medium text-primary-600 hover:text-primary-700 dark:text-primary-400">Sign in</a>
      </p>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/validate.js"></script>
  <script>
    App.ready(function ($) {
      // Password strength meter
      var LEVELS = [
        { label: 'At least 8 characters.', cls: '' },
        { label: 'Weak', cls: 'bg-red-500' },
        { label: 'Fair', cls: 'bg-amber-500' },
        { label: 'Good', cls: 'bg-sky-500' },
        { label: 'Strong', cls: 'bg-emerald-500' },
      ];
      $('#r-password').on('input', function () {
        var v = this.value, score = 0;
        if (v.length >= 8) score++;
        if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
        if (/\d/.test(v)) score++;
        if (/[^A-Za-z0-9]/.test(v)) score++;
        if (v && !score) score = 1;
        var lvl = LEVELS[score];
        $('[data-strength-bar]').each(function (i) {
          $(this).removeClass('bg-red-500 bg-amber-500 bg-sky-500 bg-emerald-500')
            .toggleClass('bg-slate-200 dark:bg-slate-700', i >= score)
            .addClass(i < score ? lvl.cls : '');
        });
        $('[data-strength-label]').text(lvl.label);
        if ($('#r-confirm').val()) $('#r-confirm').trigger('change');
      });

      $('#register-form').formValidate({
        onValid: function ($form, data) {
          var $btn = $form.find('[type=submit]').prop('disabled', true);
          $btn.find('[data-spinner]').removeClass('hidden');
          // Replace with your request, e.g. $.post('/register', data)
          setTimeout(function () {
            $btn.prop('disabled', false).find('[data-spinner]').addClass('hidden');
            App.toast('Account created for ' + data.email + ' (demo)', 'success');
          }, 800);
        },
      });
    });
  </script>
</body>
</html>
