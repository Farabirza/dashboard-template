<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tables</title>
  <script src="assets/js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17?plugins=forms"></script>
  <script src="assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="tables" data-title="Tables" class="bg-slate-50 font-sans text-slate-700 antialiased dark:bg-slate-950 dark:text-slate-300">

  <div data-include="partials/sidebar.html"></div>

  <div id="main" class="flex min-h-screen flex-col">
    <div data-include="partials/navbar.html"></div>

    <main class="flex-1 space-y-6 p-4 sm:p-6 lg:p-8">
      <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <h2 class="text-2xl font-semibold tracking-tight text-slate-900 dark:text-white">Users</h2>
          <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Search, sort and paginate with the <code class="rounded bg-slate-100 px-1 py-0.5 text-xs dark:bg-slate-800">simpleTable</code> jQuery plugin.</p>
        </div>
        <button type="button" data-modal-open="modal-user" class="inline-flex items-center gap-2 self-start rounded-lg bg-primary-600 px-3 py-2 text-sm font-medium text-white shadow-sm hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500/40 sm:self-auto">
          <i data-lucide="plus" class="h-4 w-4"></i> Add user
        </button>
      </div>

      <section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-card dark:border-slate-800 dark:bg-slate-900">
        <!-- Toolbar -->
        <div class="flex flex-col gap-3 border-b border-slate-200 p-4 sm:flex-row sm:items-center dark:border-slate-800">
          <div class="relative w-full sm:max-w-xs">
            <i data-lucide="search" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"></i>
            <input id="users-search" type="search" placeholder="Search name, email, role…" class="w-full rounded-lg border border-slate-200 bg-white py-2 pl-9 pr-3 text-sm placeholder:text-slate-400 focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500/20 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200">
          </div>
          <select id="users-status" class="rounded-lg border border-slate-200 bg-white py-2 pl-3 pr-8 text-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500/20 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200">
            <option value="">All statuses</option>
            <option>Active</option>
            <option>Invited</option>
            <option>Suspended</option>
          </select>
          <button type="button" data-toast="CSV exported" data-toast-type="success" class="inline-flex items-center justify-center gap-2 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 sm:ml-auto dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700">
            <i data-lucide="file-down" class="h-4 w-4"></i> Export
          </button>
        </div>

        <!-- Table renders here -->
        <div id="users-table"></div>
      </section>
    </main>

    <div data-include="partials/footer.html"></div>
  </div>

  <!-- Add / edit user modal -->
  <div id="modal-user" class="modal fixed inset-0 z-[60] hidden items-center justify-center bg-slate-900/50 p-4 backdrop-blur-sm" role="dialog" aria-modal="true" aria-labelledby="modal-user-title">
    <form id="user-form" class="modal-panel w-full max-w-lg rounded-2xl bg-white shadow-xl dark:bg-slate-900 dark:ring-1 dark:ring-slate-800" novalidate>
      <div class="flex items-center justify-between border-b border-slate-200 px-6 py-4 dark:border-slate-800">
        <h3 id="modal-user-title" class="text-base font-semibold text-slate-900 dark:text-white">Add user</h3>
        <button type="button" data-modal-close class="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-600 dark:hover:bg-slate-800" aria-label="Close"><i data-lucide="x" class="h-5 w-5"></i></button>
      </div>
      <div class="grid gap-4 px-6 py-5 sm:grid-cols-2">
        <input type="hidden" name="id">
        <div class="sm:col-span-2">
          <label for="f-name" class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300">Full name</label>
          <input id="f-name" name="name" required class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500/20 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200">
        </div>
        <div class="sm:col-span-2">
          <label for="f-email" class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300">Email</label>
          <input id="f-email" name="email" type="email" required class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500/20 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200">
        </div>
        <div>
          <label for="f-role" class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300">Role</label>
          <select id="f-role" name="role" class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500/20 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200">
            <option>Admin</option><option>Editor</option><option selected>Viewer</option>
          </select>
        </div>
        <div>
          <label for="f-status" class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300">Status</label>
          <select id="f-status" name="status" class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500/20 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200">
            <option>Active</option><option selected>Invited</option><option>Suspended</option>
          </select>
        </div>
      </div>
      <div class="flex justify-end gap-2 border-t border-slate-200 px-6 py-4 dark:border-slate-800">
        <button type="button" data-modal-close class="rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700">Cancel</button>
        <button type="submit" class="rounded-lg bg-primary-600 px-4 py-2 text-sm font-medium text-white hover:bg-primary-700">Save</button>
      </div>
    </form>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/simple-table.js"></script>
  <script>
    App.ready(function ($) {
      var esc = $.fn.simpleTable.escape;

      // ---- Demo data (replace with $.getJSON('/api/users', table.setData.bind(table))) ----
      var first = ['Olivia', 'Liam', 'Emma', 'Noah', 'Ava', 'Elijah', 'Sophia', 'James', 'Mia', 'Lucas', 'Amelia', 'Mason', 'Harper', 'Ethan', 'Evelyn', 'Logan'];
      var last = ['Martin', 'Lee', 'Nguyen', 'Kim', 'Davis', 'Garcia', 'Brown', 'Wilson', 'Clark', 'Lewis', 'Walker', 'Young'];
      var roles = ['Admin', 'Editor', 'Viewer', 'Viewer', 'Editor'];
      var statuses = ['Active', 'Active', 'Active', 'Invited', 'Suspended'];
      var rows = [];
      for (var i = 0; i < 48; i++) {
        var f = first[i % first.length], l = last[(i * 7) % last.length];
        var d = new Date(2026, 10, 10 - i * 5);
        rows.push({
          id: i + 1,
          name: f + ' ' + l,
          email: (f + '.' + l).toLowerCase() + '@example.com',
          role: roles[i % roles.length],
          status: statuses[(i * 3) % statuses.length],
          joined: d.toISOString().slice(0, 10),
        });
      }
      var nextId = rows.length + 1;

      var STATUS = {
        Active: 'bg-emerald-50 text-emerald-700 ring-emerald-600/20 dark:bg-emerald-500/10 dark:text-emerald-400 dark:ring-emerald-500/20',
        Invited: 'bg-sky-50 text-sky-700 ring-sky-600/20 dark:bg-sky-500/10 dark:text-sky-400 dark:ring-sky-500/20',
        Suspended: 'bg-red-50 text-red-700 ring-red-600/20 dark:bg-red-500/10 dark:text-red-400 dark:ring-red-500/20',
      };

      var allRows = rows;
      var table = $('#users-table').simpleTable({
        data: rows,
        pageSize: 10,
        search: '#users-search',
        searchKeys: ['name', 'email', 'role'],
        columns: [
          {
            key: 'name', label: 'User', render: function (v, r) {
              var initials = v.split(' ').map(function (p) { return p[0]; }).join('');
              return '<div class="flex items-center gap-3">' +
                '<span class="flex h-9 w-9 items-center justify-center rounded-full bg-primary-100 text-xs font-semibold text-primary-700 dark:bg-primary-500/15 dark:text-primary-300">' + esc(initials) + '</span>' +
                '<div><p class="font-medium text-slate-900 dark:text-white">' + esc(v) + '</p><p class="text-xs text-slate-500 dark:text-slate-400">' + esc(r.email) + '</p></div></div>';
            },
          },
          { key: 'role', label: 'Role' },
          {
            key: 'status', label: 'Status', render: function (v) {
              return '<span class="inline-flex items-center gap-1.5 rounded-full px-2 py-0.5 text-xs font-medium ring-1 ring-inset ' + STATUS[v] + '"><span class="h-1.5 w-1.5 rounded-full bg-current"></span>' + esc(v) + '</span>';
            },
          },
          { key: 'joined', label: 'Joined', render: function (v) { return '<span class="tabular-nums text-slate-500 dark:text-slate-400">' + esc(v) + '</span>'; } },
          {
            key: 'id', label: '', sortable: false, className: 'text-right', render: function (v) {
              return '<div class="inline-flex gap-1">' +
                '<button type="button" data-edit="' + v + '" class="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-700 dark:hover:bg-slate-800 dark:hover:text-slate-200" aria-label="Edit"><i data-lucide="pencil" class="h-4 w-4"></i></button>' +
                '<button type="button" data-delete="' + v + '" class="rounded-lg p-1.5 text-slate-400 hover:bg-red-50 hover:text-red-600 dark:hover:bg-red-500/10 dark:hover:text-red-400" aria-label="Delete"><i data-lucide="trash-2" class="h-4 w-4"></i></button>' +
                '</div>';
            },
          },
        ],
      }).data('simpleTable');

      function applyStatusFilter() {
        var s = $('#users-status').val();
        table.setData(s ? $.grep(allRows, function (r) { return r.status === s; }) : allRows);
      }
      $('#users-status').on('change', applyStatusFilter);

      // ---- Add / edit ----
      var $form = $('#user-form');
      $('[data-modal-open="modal-user"]').on('click', function () {
        $form[0].reset();
        $form.find('[name=id]').val('');
        $('#modal-user-title').text('Add user');
      });

      $('#users-table').on('click', '[data-edit]', function () {
        var id = +$(this).data('edit');
        var row = allRows.find(function (r) { return r.id === id; });
        $form.find('[name=id]').val(row.id);
        $form.find('[name=name]').val(row.name);
        $form.find('[name=email]').val(row.email);
        $form.find('[name=role]').val(row.role);
        $form.find('[name=status]').val(row.status);
        $('#modal-user-title').text('Edit user');
        App.modal.open('modal-user');
      });

      $form.on('submit', function (e) {
        e.preventDefault();
        var invalid = $form.find('[required]').filter(function () { return !this.checkValidity(); });
        $form.find('[required]').removeClass('border-red-500 focus:border-red-500 focus:ring-red-500/20');
        if (invalid.length) {
          invalid.addClass('border-red-500 focus:border-red-500 focus:ring-red-500/20').first().trigger('focus');
          App.toast('Please fill in a valid name and email.', 'error');
          return;
        }
        var data = {};
        $.each($form.serializeArray(), function (_, f) { data[f.name] = f.value; });
        if (data.id) {
          var row = allRows.find(function (r) { return r.id === +data.id; });
          $.extend(row, { name: data.name, email: data.email, role: data.role, status: data.status });
          App.toast('User updated', 'success');
        } else {
          allRows.unshift({ id: nextId++, name: data.name, email: data.email, role: data.role, status: data.status, joined: new Date().toISOString().slice(0, 10) });
          App.toast('User added', 'success');
        }
        applyStatusFilter();
        App.modal.close('modal-user');
      });

      // ---- Delete with confirm ----
      $('#users-table').on('click', '[data-delete]', function () {
        var id = +$(this).data('delete');
        var row = allRows.find(function (r) { return r.id === id; });
        App.confirm({ title: 'Delete user?', message: row.name + ' will lose access immediately.', confirmText: 'Delete' }).then(function (ok) {
          if (!ok) return;
          allRows = $.grep(allRows, function (r) { return r.id !== id; });
          applyStatusFilter();
          App.toast('User deleted', 'success');
        });
      });
    });
  </script>
</body>
</html>
